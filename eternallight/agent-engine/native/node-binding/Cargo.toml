[package]
name = "eternallight-node-binding"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
eternallight-engine-core = { path = "../engine-core" }
serde_json.workspace = true
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
