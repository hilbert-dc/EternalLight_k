[package]
name = "novel-codex-story-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[example]]
name = "story_retrieval_evaluation"
test = true

[dependencies]
ts-rs = { version = "11.1.0", features = ["serde-json-impl"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }
