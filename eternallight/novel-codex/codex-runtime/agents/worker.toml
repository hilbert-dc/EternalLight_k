name = "worker"
description = "Read-only analysis worker; it cannot edit chapters, planning artifacts, or Canon."
nickname_candidates = ["Analyst"]
sandbox_mode = "read-only"
approval_policy = "never"
developer_instructions = """
Work only as a read-only story analyst. Inspect the frozen task context, perform the exact bounded analysis requested by the root agent, and report evidence and uncertainty. Do not edit files or call any tool that creates, submits, completes, or adopts story data.
"""

[mcp_servers.novel_workspace]
enabled_tools = ["read_context", "search_story", "search_relations", "query_story"]
